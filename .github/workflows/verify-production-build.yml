name: Verify production Docker build
on:
  pull_request:
    paths:
      - Dockerfile.web
      - .github/release-age/**
      - .github/workflows/verify-production-build.yml
      - package-lock.json
      - uv.lock
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the production image without publishing
        run: docker build --file Dockerfile.web --tag release-check .
